<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — dormouse</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/site/assets/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --paper: #f6f3ec; --line: #e3ded2; --line2: #d3ccbc; --ink: #1b1a17;
    --dim: #57534a; --dimmer: #6f6a5f; --accent: #2a66c2;
    --mono: "DejaVu Sans Mono", "Liberation Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0a0b0d; --line: #1e2128; --line2: #2a2e37; --ink: #e8e6e1;
      --dim: #b6b4ae; --dimmer: #9aa0a9; --accent: #7aa2e8;
    }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--paper); color: var(--ink); font-family: var(--sans);
    padding: 32px; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; }
  .kicker {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--dimmer); margin: 0 0 16px;
  }
  h1 {
    font-family: var(--mono); font-weight: 400; font-size: clamp(40px, 12vw, 84px);
    line-height: 1; letter-spacing: -0.04em; margin: 0;
  }
  h1 span { display: block; color: var(--dimmer); }
  p { color: var(--dim); font-size: 16px; line-height: 1.66; margin: 20px 0 0; max-width: 46ch; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  a {
    font-family: var(--mono); font-size: 13px; text-decoration: none; color: var(--ink);
    border: 1px solid var(--line2); border-radius: 9px; padding: 10px 16px;
  }
  a.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  a:hover { border-color: var(--accent); color: var(--accent); }
  a.primary:hover { color: var(--paper); opacity: 0.9; border-color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="kicker">dormouse</p>
  <h1><span>404</span>no such byte</h1>
  <p>This page is not in the file. The model, unlike the site, cannot meet a symbol it has no
    mapping for — that is the whole argument for a 256-symbol alphabet.</p>
  <div class="links">
    <a class="primary" href="/site/">Back to the front page</a>
    <a href="/site/docs/">Documentation</a>
  </div>
</main>
</body>
</html>
