<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
  <title id="t">dormouse — an open language model that runs offline from one file</title>

  <defs>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1b1a17" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#f6f3ec"/>
  <rect width="1200" height="630" fill="url(#grain)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#d3ccbc"/>

  <!-- the mark: one lowercase letter, like a doorway -->
  <text x="140" y="442" font-family="'DejaVu Sans Mono', ui-monospace, monospace"
        font-size="408" font-weight="600" fill="#1b1a17">д</text>

  <!-- the seam -->
  <rect x="404" y="186" width="1" height="256" fill="#d9d2c2"/>

  <!-- the name -->
  <text x="466" y="288" font-family="'DejaVu Sans', sans-serif"
        font-size="86" letter-spacing="-1.6" fill="#1b1a17">dormouse</text>

  <!-- what it is -->
  <text x="470" y="352" font-family="'DejaVu Sans Mono', ui-monospace, monospace"
        font-size="28" fill="#57534a">an open model that runs offline</text>
  <text x="470" y="390" font-family="'DejaVu Sans Mono', ui-monospace, monospace"
        font-size="28" fill="#57534a">from one file</text>

  <!-- the single accent -->
  <rect x="470" y="428" width="40" height="2" fill="#2a66c2"/>
  <text x="526" y="433" font-family="'DejaVu Sans Mono', ui-monospace, monospace"
        font-size="17" letter-spacing="2.2" fill="#6f6a5f">APACHE-2.0 · NO NETWORK</text>
</svg>
