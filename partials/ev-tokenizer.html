<p>A joint Russian/English BPE with a 32k vocabulary moves <b>3.42×</b> more bytes per second at
equal held-out quality, because the step then predicts 4.4 bytes per token instead of one. It
also stops raw UTF-8 from being spent on Cyrillic and CJK. <a href="docs/formats/">How the
formats and the tokenizer fit →</a></p>
